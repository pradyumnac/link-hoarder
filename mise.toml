# Tool versions and project tasks.
[tools]
python = "3.14"
uv = "latest"
git-cliff = "latest"
node = "24"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.install]
description = "Sync all locked dependencies"
run = "uv venv --clear .venv && uv sync --python .venv --all-extras --dev && npm --prefix frontend ci"

[tasks.format]
description = "Format Python files"
run = "uv run ruff format ."

[tasks.lint]
description = "Check formatting and lint rules"
run = "uv run ruff format --check . && uv run ruff check ."

[tasks.typecheck]
description = "Type-check all Python files"
run = "uv run mypy src tests"

[tasks.test]
description = "Run tests with coverage"
run = "uv run pytest --cov=link_hoarder --cov-report=term-missing --cov-fail-under=70"

[tasks.frontend-generate]
description = "Generate frontend types from OpenAPI"
depends = ["openapi"]
run = "npm --prefix frontend run generate:api"

[tasks.frontend-typecheck]
description = "Type-check the Vue frontend"
run = "npm --prefix frontend run typecheck"

[tasks.frontend-test]
description = "Test the Vue frontend"
run = "npm --prefix frontend test"

[tasks.frontend-build]
description = "Build the Vue frontend"
run = "npm --prefix frontend run build"

[tasks.frontend-check]
description = "Run every frontend gate"
run = "npm --prefix frontend run typecheck && npm --prefix frontend test && npm --prefix frontend run build"

[tasks.check]
description = "Run every local gate"
depends = ["lint", "typecheck", "test", "frontend-check"]

[tasks.hooks]
description = "Install Git pre-commit hooks"
run = "uv run pre-commit install"

[tasks.build]
description = "Build the wheel and source distribution"
run = "uv build"

[tasks.install-local]
description = "Install the current wheel into the project venv"
depends = ["install", "build"]
run = "uv pip install --python .venv --no-deps --reinstall dist/link_hoarder-0.1.0-py3-none-any.whl"

[tasks.openapi]
description = "Generate the committed OpenAPI contract"
run = "uv run python -m link_hoarder.api.openapi"

[tasks.serve]
description = "Run the authenticated API"
run = "uv run link-hoarder api"

[tasks.serve-web]
description = "Build and serve the integrated web application"
run = "docker compose -f stack/compose.yaml up --build"

[tasks.stack-up]
description = "Build and start the Docker stack"
run = "docker compose -f stack/compose.yaml up --build -d"

[tasks.stack-down]
description = "Stop the Docker stack"
run = "docker compose -f stack/compose.yaml down"

[tasks.changelog]
description = "Generate the changelog from Conventional Commits"
run = "git-cliff --output CHANGELOG.md"

[tasks.skills]
description = "Discover and install official library skills as copies"
run = "uvx library-skills --all --copy --tool-skill"

[tasks.skills-list]
description = "List official library skills"
run = "uvx library-skills list"

[tasks.release-check]
description = "Verify checks and build release files"
depends = ["check", "build"]
