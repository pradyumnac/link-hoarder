upstream frontend_stable {
    server frontend-stable:80;
}

upstream frontend_staging {
    server frontend-staging:80;
}

map $arg_version $requested_variant {
    default $cookie_link_hoarder_variant;
    stable stable;
    staging staging;
}

map $requested_variant $frontend_upstream {
    default frontend_stable;
    staging frontend_staging;
}

map $arg_version $variant_cookie {
    default "";
    stable "link_hoarder_variant=stable; Path=/; SameSite=Strict";
    staging "link_hoarder_variant=staging; Path=/; SameSite=Strict";
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    add_header Set-Cookie $variant_cookie always;
    add_header Vary Cookie always;

    location / {
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
