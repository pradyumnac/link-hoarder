services:
  api:
    build:
      context: ..
      dockerfile: stack/Dockerfile
    image: link-hoarder-api:local
    init: true
    stop_grace_period: 10s
    environment:
      LINK_HOARDER_API_KEY: ${LINK_HOARDER_API_KEY:-}
      LINK_HOARDER_LOG_LEVEL: ${LINK_HOARDER_LOG_LEVEL:-INFO}
      LINK_HOARDER_METADATA_CACHE_PATH: /data/metadata-cache
      LINK_HOARDER_METADATA_REFRESH_ENABLED: ${LINK_HOARDER_METADATA_REFRESH_ENABLED:-true}
      LINK_HOARDER_PREVIEW_PROVIDER: ${LINK_HOARDER_PREVIEW_PROVIDER:-builtin}
      LINK_HOARDER_PREVIEW_SERVICE_URL: http://preview:3001
    volumes:
      - link-hoarder-data:/data
      - link-hoarder-secrets:/run/link-hoarder
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          key=open('/run/link-hoarder/api-key').read();
          request=urllib.request.Request('http://127.0.0.1:8000/health',headers={'X-API-Key':key});
          urllib.request.urlopen(request,timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  preview:
    build:
      context: ..
      dockerfile: stack/preview/Dockerfile
    image: link-hoarder-preview:local
    init: true
    stop_grace_period: 10s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    image: link-hoarder-frontend:local
    init: true
    stop_grace_period: 10s
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LINK_HOARDER_PORT:-8080}:80"
    volumes:
      - link-hoarder-secrets:/run/link-hoarder:ro
    restart: unless-stopped

volumes:
  link-hoarder-data:
  link-hoarder-secrets:
