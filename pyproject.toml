[project]
name = "link-hoarder"
version = "0.1.0"
description = "Manage and import browser bookmarks through a typed CLI and API."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Pradyumna Chatterjee", email = "chatterjee.pra@gmail.com" }]
dependencies = [
    "fastapi>=0.141.1",
    "platformdirs>=4.11.3",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.39",
    "structlog>=26.1.0",
    "typer>=0.27.1",
    "uvicorn>=0.52.4",
]

[project.scripts]
link-hoarder = "link_hoarder.cli.app:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "mypy",
    "ruff",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.6.2",
    "httpx2>=2.12.0",
]
docs = [
    "mkdocs>=1.6,<2",
]
[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = [".agents"]

[tool.ruff.lint]
# Inherit Ruff's curated baseline, then add the rulesets that catch real
# defects. Ruff's own default is E and F only, which misses import order,
# modernisation, and most bug patterns.
extend-select = [
    "B",    # flake8-bugbear: likely bugs
    "I",    # isort: import order
    "UP",   # pyupgrade: modern syntax for the target version
    "C4",   # comprehensions
    "SIM",  # simplify
    "PTH",  # prefer pathlib over os.path
]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
# strict = true does NOT ban Any. This key is what bans it.
disallow_any_explicit = true
disallow_any_generics = true
warn_return_any = true
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
# --strict-config errors on a misspelled config key.
# --strict-markers errors on an undeclared marker.
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
